# ====================================================================
# Configuracion de la aplicacion - Consultorio Medico
# ====================================================================

spring.application.name=consultorio-app
server.port=8080

# --------------------------------------------------------------------
# Base de datos MySQL
# --------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/consultorio_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway (migraciones de base de datos)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --------------------------------------------------------------------
# Redis (bloqueos distribuidos)
# --------------------------------------------------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000

# --------------------------------------------------------------------
# Seguridad JWT
# --------------------------------------------------------------------
# Clave secreta en Base64 (minimo 256 bits para HS256)
app.jwt.secret=${JWT_SECRET:Y29uc3VsdG9yaW9NZWRpY29TZWNyZXRLZXkyMDI2U2VjdXJl}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# --------------------------------------------------------------------
# Cifrado AES-256-GCM para historia clinica
# --------------------------------------------------------------------
# Clave en Base64 de exactamente 32 bytes (256 bits)
app.encryption.key=${APP_ENCRYPTION_KEY:Q29uc3VsdG9yaW9BRVMyNTZLZXlTZWN1cmUyMDI2}

# --------------------------------------------------------------------
# Bloqueo distribuido (TTL en milisegundos)
# --------------------------------------------------------------------
app.lock.ttl-ms=5000
app.lock.wait-ms=100
app.lock.retry-attempts=3

# --------------------------------------------------------------------
# CORS
# --------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# --------------------------------------------------------------------
# Logging
# --------------------------------------------------------------------
logging.level.com.consultorio=INFO
logging.level.org.springframework.security=WARN
